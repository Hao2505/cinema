# nginx site cho VibeCinema (__DOMAIN__ → 127.0.0.1:__PORT__). Bản ghi cinema trên Cloudflare là DNS only (đám mây xám,
# từ 2026-11-03 — qua proxy Cloudflare khách VN bị vòng sang Tokyo, RTT 440 ms): trình duyệt nối thẳng nginx này. Site nghe
# cả 80 lẫn 443 (chứng chỉ Let's Encrypt lấy bằng webroot — deploy.sh --setup tự lấy, certbot tự gia hạn).
# KHÔNG redirect http → https ở đây: app tự chuyển (httpsRedirectUrl, xét CF-Visitor nên bật lại proxy chế độ nào cũng
# không vòng lặp). Bản nén br / gzip do app làm.
# Dòng có "# __SSL__" bị bỏ khi chưa có chứng chỉ (deploy.sh dựng bản chỉ HTTP trước để lấy chứng chỉ).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl; # __SSL__
    listen [::]:443 ssl; # __SSL__
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem; # __SSL__
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem; # __SSL__
    include /etc/letsencrypt/options-ssl-nginx.conf; # __SSL__
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # __SSL__
    server_name __DOMAIN__;

    # IP thật của người xem: CHỈ tin header CF-Connecting-IP khi kết nối đến từ dải IP của Cloudflare
    # (https://www.cloudflare.com/ips/ — cập nhật nếu Cloudflare đổi). Ai gọi thẳng IP VPS kèm header giả thì vẫn
    # bị tính đúng IP của họ. Chỉ áp cho site này, không đụng site khác.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ACME challenge: certbot (webroot /var/www/html) lấy + gia hạn chứng chỉ qua cổng 80
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # WebSocket của rạp (vị trí 15 lần/giây, chat…): chuyển thẳng, không gom, giữ kết nối lâu
    location = /ws {
        access_log off;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API (health, đăng nhập admin): giới hạn nhịp — vùng vcin_api khai báo ở conf.d/vibecinema-limit.conf
    location /api/ {
        limit_req zone=vcin_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # mở trang kiểu ?admin=<mã> (cách cũ) thì không ghi log — nên dùng #admin=<mã> (không bao giờ gửi lên máy chủ)
        if ($arg_admin) { access_log off; }
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
