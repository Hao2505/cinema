# Phần http{} của VibeCinema — chỉ thị ở đây phải nằm trong http{} (file site chỉ có server{}) nên để ở
# /etc/nginx/conf.d/vibecinema-limit.conf (deploy/deploy.sh --setup tự chép). Mọi tên có tiền tố "vcin_" để KHÔNG trùng
# app khác trên VPS dùng chung (VibeCorp: vpa_api) — trùng tên zone limit_req hay tên log_format là `nginx -t` lỗi cả máy.

# Vùng giới hạn nhịp cho /api/: khoá theo $binary_remote_addr = IP thật của người xem (site VibeCinema bật realip chỉ tin
# dải IP Cloudflare, xem nginx.site.conf) — chỉ nằm trong bộ nhớ nginx, không ghi ra đĩa. 2 yêu cầu / giây mỗi IP, cho
# dồn 10 rồi trả 429.
limit_req_zone $binary_remote_addr zone=vcin_api:10m rate=2r/s;

# Định dạng log truy cập của site (nginx.site.conf: access_log … vcin_noip): KHÔNG có IP ($remote_addr), KHÔNG có
# Referer / User-Agent, đường dẫn là $uri — không kèm phần "?…" (link cũ ?phong=… / ?admin=… không vào log); phần "#…"
# (link phòng riêng /#phong=p-…, #admin=…) trình duyệt vốn không bao giờ gửi lên máy chủ. Trang chính sách (/chinh-sach)
# hứa đúng như vậy — thêm trường nào vào đây thì sửa trang đó. log_format phải được khai báo TRƯỚC site dùng nó:
# nginx.conf mặc định của Ubuntu include conf.d/*.conf trước sites-enabled/* (sai thứ tự → `nginx -t` báo "unknown log
# format" và deploy.sh gỡ phần của rạp, không reload).
log_format vcin_noip '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
