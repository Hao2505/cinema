# Vùng giới hạn nhịp cho /api/ của VibeCinema — phải nằm trong http{} nên để ở /etc/nginx/conf.d/vibecinema-limit.conf
# (deploy/deploy.sh --setup tự chép). Tên vùng có tiền tố "vcin_" để KHÔNG trùng VibeCorp (vpa_api) — trùng tên zone là
# nginx lỗi cả máy. Khoá theo $binary_remote_addr = IP thật của người xem (site VibeCinema bật realip chỉ tin dải IP
# Cloudflare, xem nginx.site.conf). 2 yêu cầu / giây mỗi IP, cho dồn 10 rồi trả 429.
limit_req_zone $binary_remote_addr zone=vcin_api:10m rate=2r/s;
